# RG35XX H output profile v2. UCM owns hardware gain; the app owns volume.
# Speaker DAC 63 and line-out 31 remove 11.8 dB of fixed attenuation.
# The codec defers physical line-out enable until its ramp has settled.
SectionDevice."Speaker" {
    Comment "Internal Speaker"
    EnableSequence [
        cset "name='Speaker Switch' off"
        cset "name='Line Out Playback Switch' off"
        cset "name='DAC Playback Volume' 63"
        cset "name='Line Out Playback Volume' 31"
        cset "name='DAC Playback Switch' on"
        cset "name='DAC Reversed Playback Switch' off"
        cset "name='Line Out Source Playback Route' Stereo,Stereo"
        cset "name='Line Out Playback Switch' on"
        cset "name='Speaker Switch' on"
    ]
    Value {
        PlaybackMixerElem "Line Out"
        PlaybackPCM "hw:${CardId},0"
    }
    DisableSequence [
        cset "name='Speaker Switch' off"
        cset "name='Line Out Playback Switch' off"
    ]
    ConflictingDevice [ "Headphones" ]
}

SectionDevice."Headphones" {
    Comment "Headphones"
    EnableSequence [
        cset "name='Speaker Switch' off"
        cset "name='Line Out Playback Switch' off"
        cset "name='DAC Playback Volume' 45"
        cset "name='Line Out Playback Volume' 16"
        cset "name='DAC Reversed Playback Switch' off"
        cset "name='Line Out Source Playback Route' Stereo,Stereo"
        cset "name='DAC Playback Switch' on"
        cset "name='Line Out Playback Switch' on"
    ]
    Value {
        PlaybackMixerElem "Line Out"
        PlaybackPCM "hw:${CardId},0"
        JackControl "Headphone Jack"
    }
    ConflictingDevice [ "Speaker" ]
}
