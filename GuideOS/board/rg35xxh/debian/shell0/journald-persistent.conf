[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=16M
SystemMaxFileSize=4M
SystemKeepFree=64M
RuntimeMaxUse=8M
# An offline Deck may correct its clock by months on first NTP contact.
# Retain by size, so that correction cannot age out this boot's evidence.
MaxRetentionSec=0
MaxFileSec=0
SyncIntervalSec=5s
