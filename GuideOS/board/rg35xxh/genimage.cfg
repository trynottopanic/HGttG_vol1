image boot.vfat {
	vfat {
		files = {
			"Image",
			"allwinner",
			"extlinux",
			"README-PANEL.txt"
		}
	}
	size = 64M
}

image sdcard.img {
	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1000K
	}

	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1008K
		gpt-no-backup = true
	}

	partition boot {
		offset = 1M
		partition-type-uuid = U
		image = "boot.vfat"
	}

	partition rootfs {
		image = "rootfs.ext4"
		partition-uuid = 485e4ab2-4b05-4e68-877f-df6af64f3918
	}
}
