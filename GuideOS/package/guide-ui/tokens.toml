[schema]
name = "Guide UI Runtime Tokens"
version = 0
theme = "paper-0"
typography = "typography-0"

[display]
profile = "deck-640x480"
width = 640
height = 480

[colors]
paper = "#EFEDE1"
ink = "#3A3B30"
blue = "#446470"
blue_light = "#91A7AE"
rust = "#9D4E22"
green = "#416F4B"
danger = "#973930"
panel = "#E7E4D7"
white = "#F6F3E7"

[fonts.serif.bold]
production = ["NotoSerif-Bold.ttf"]
reduced = ["DejaVuSerif-Bold.ttf"]
preview = ["georgiab.ttf"]

[fonts.sans.regular]
production = ["NotoSans-Regular.ttf"]
reduced = ["DejaVuSans.ttf"]
preview = ["segoeui.ttf"]

[fonts.sans.bold]
production = ["NotoSans-Bold.ttf"]
reduced = ["DejaVuSans-Bold.ttf"]
preview = ["segoeuib.ttf"]

[fonts.mono.regular]
production = ["NotoSansMono-Regular.ttf"]
reduced = ["DejaVuSansMono.ttf"]
preview = ["consola.ttf"]

[typography.masthead]
family = "serif"
weight = "bold"
size = 19

[typography.screen_title]
family = "sans"
weight = "bold"
size = 15

[typography.body]
family = "sans"
weight = "regular"
size = 15

[typography.body_strong]
family = "sans"
weight = "bold"
size = 15

[typography.control]
family = "sans"
weight = "regular"
size = 12

[typography.control_strong]
family = "sans"
weight = "bold"
size = 12

[typography.metadata]
family = "sans"
weight = "regular"
size = 12

[typography.numeric]
family = "mono"
weight = "regular"
size = 12
